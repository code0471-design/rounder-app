# Codemagic: Android Play AAB + optional iOS build.
# Select workflow "Android release AAB" for Play Console upload.
# iOS TestFlight publishing temporarily disabled so yaml validates without
# matching an App Store Connect API key name. Re-enable later with:
#   integrations: { app_store_connect: <exact key name from Codemagic Integrations> }
#   publishing.app_store_connect.auth: integration
workflows:
  ios-first:
    name: iOS first (Android optional)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.golfrounder.golfRounder
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build Android (non-blocking)
        ignore_failure: true
        script: |
          flutter build appbundle --release --android-skip-build-dependency-validation \
            --build-name=1.0.0 --build-number=23
      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$((CM_BUILD_ID % 10000 + 10))
    artifacts:
      - build/**/outputs/**/*.aab
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # Sideload build for testing on a device without waiting for Play propagation.
  android-release-apk:
    name: Android release APK (sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - rounder_upload
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build release APK
        script: |
          flutter build apk --release --android-skip-build-dependency-validation \
            --build-name=1.0.0 --build-number=23
    artifacts:
      - build/**/outputs/**/*.apk

  android-release:
    name: Android release AAB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - rounder_upload
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build release AAB
        script: |
          set +e
          flutter build appbundle --release --android-skip-build-dependency-validation \
            --build-name=1.0.0 --build-number=23 2>&1 | tee /tmp/rounder_aab.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "===== What went wrong (excerpt) ====="
            grep -n -A 25 "What went wrong" /tmp/rounder_aab.log || true
            echo "===== FAILURE lines ====="
            grep -n -E "FAILURE:|AAR metadata|Execution failed|error:" /tmp/rounder_aab.log | tail -n 40 || true
          fi
          exit $status
    artifacts:
      - build/**/outputs/**/*.aab
