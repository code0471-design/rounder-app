# Codemagic: Android Play AAB + optional iOS build.
# Select workflow "Android release AAB" for Play Console upload.
# iOS TestFlight publishing temporarily disabled so yaml validates without
# matching an App Store Connect API key name. Re-enable later with:
#   integrations: { app_store_connect: <exact key name from Codemagic Integrations> }
#   publishing.app_store_connect.auth: integration
workflows:
  ios-first:
    name: iOS first (Android optional)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.golfrounder.golfRounder
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build Android (non-blocking)
        ignore_failure: true
        script: |
          flutter build appbundle --release --android-skip-build-dependency-validation
      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$((CM_BUILD_ID % 10000 + 10))
    artifacts:
      - build/**/outputs/**/*.aab
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-release:
    name: Android release AAB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - rounder_upload
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build release AAB
        script: |
          set +e
          flutter build appbundle --release --android-skip-build-dependency-validation
          status=$?
          if [ $status -ne 0 ]; then
            echo "===== Gradle failure excerpts ====="
            rg -n "What went wrong|AAR metadata|error:|FAILURE:" -S build android .dart_tool 2>/dev/null | tail -n 80 || true
            find . -name "*.txt" -path "*/reports/*" 2>/dev/null | head -n 20 || true
          fi
          exit $status
    artifacts:
      - build/**/outputs/**/*.aab
