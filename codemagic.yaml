# Codemagic: Android Play AAB + optional iOS build.
# Select workflow "Android release AAB" for Play Console upload.
# Version comes from pubspec.yaml (e.g. 1.0.0+30) — do NOT hardcode --build-number.
# iOS TestFlight publishing temporarily disabled so yaml validates without
# matching an App Store Connect API key name. Re-enable later with:
#   integrations: { app_store_connect: <exact key name from Codemagic Integrations> }
#   publishing.app_store_connect.auth: integration
workflows:
  ios-first:
    name: iOS first (Android optional)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.golfrounder.golfRounder
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build Android (non-blocking)
        ignore_failure: true
        script: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          BUILD_NAME=${VERSION_LINE#version:}
          BUILD_NAME=${BUILD_NAME%%+*}
          BUILD_NUMBER=${VERSION_LINE##*+}
          echo "Android version: $BUILD_NAME+$BUILD_NUMBER"
          flutter build appbundle --release --android-skip-build-dependency-validation \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
      - name: Build iOS IPA
        script: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          BUILD_NAME=${VERSION_LINE#version:}
          BUILD_NAME=${BUILD_NAME%%+*}
          BUILD_NUMBER=${VERSION_LINE##*+}
          echo "iOS version: $BUILD_NAME+$BUILD_NUMBER"
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/**/outputs/**/*.aab
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # Sideload build for testing on a device without waiting for Play propagation.
  android-release-apk:
    name: Android release APK (sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - rounder_upload
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build release APK
        script: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          BUILD_NAME=${VERSION_LINE#version:}
          BUILD_NAME=${BUILD_NAME%%+*}
          BUILD_NUMBER=${VERSION_LINE##*+}
          echo "APK version: $BUILD_NAME+$BUILD_NUMBER"
          flutter build apk --release --android-skip-build-dependency-validation \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
    artifacts:
      - build/**/outputs/**/*.apk

  android-release:
    name: Android release AAB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - rounder_upload
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build release AAB
        script: |
          set +e
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          BUILD_NAME=${VERSION_LINE#version:}
          BUILD_NAME=${BUILD_NAME%%+*}
          BUILD_NUMBER=${VERSION_LINE##*+}
          echo "AAB version: $BUILD_NAME+$BUILD_NUMBER"
          flutter build appbundle --release --android-skip-build-dependency-validation \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" 2>&1 | tee /tmp/rounder_aab.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "===== What went wrong (excerpt) ====="
            grep -n -A 25 "What went wrong" /tmp/rounder_aab.log || true
            echo "===== FAILURE lines ====="
            grep -n -E "FAILURE:|AAR metadata|Execution failed|error:" /tmp/rounder_aab.log | tail -n 40 || true
          fi
          exit $status
    artifacts:
      - build/**/outputs/**/*.aab
