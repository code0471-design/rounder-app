# Codemagic: Android Play AAB + optional iOS build.
# Select workflow "Android release AAB" for Play Console upload.
# Version comes from pubspec.yaml (e.g. 1.0.0+30) — do NOT hardcode --build-number.
#
# 백엔드 환경은 APP_ENV 로 정한다 (기본 staging).
# 운영 빌드는 Codemagic 빌드 시작 화면에서 APP_ENV=prod 를 넘길 것.
# tool/select_firebase_env.js 가 네이티브 설정을 바꾸고, --dart-define=APP_ENV 가
# Dart 쪽 옵션을 맞춘다. 둘이 어긋나면 앱이 시작 시점에 막는다.
workflows:
  ios-first:
    name: iOS first (Android optional)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: CodemagicTeam
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_ENV: staging
      groups:
        - solapi
      android_signing:
        - rounder_upload
      ios_signing:
        provisioning_profiles:
          - rounder_appstore
        certificates:
          - oneclub-distribution
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Select Firebase environment
        script: node tool/select_firebase_env.js --env "$APP_ENV"
      - name: Check Solapi env
        script: python3 tool/write_solapi_defines.py
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build Android (non-blocking)
        ignore_failure: true
        script: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          BUILD_NAME=${VERSION_LINE#version:}
          BUILD_NAME=${BUILD_NAME%%+*}
          BUILD_NUMBER=${VERSION_LINE##*+}
          echo "Android version: $BUILD_NAME+$BUILD_NUMBER"
          python3 tool/write_solapi_defines.py
          flutter build appbundle --release --android-skip-build-dependency-validation \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=APP_ENV="$APP_ENV" --dart-define-from-file=solapi_defines.json
      - name: Build iOS IPA
        script: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          BUILD_NAME=${VERSION_LINE#version:}
          BUILD_NAME=${BUILD_NAME%%+*}
          BUILD_NUMBER=${VERSION_LINE##*+}
          echo "iOS version: $BUILD_NAME+$BUILD_NUMBER"
          python3 tool/write_solapi_defines.py
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=APP_ENV="$APP_ENV" --dart-define-from-file=solapi_defines.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/**/outputs/**/*.aab
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 심사는 Connect에서 수동 제출 (자동 App Store 제출은 끔)

  # Sideload build for testing on a device without waiting for Play propagation.
  android-release-apk:
    name: Android release APK (sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        APP_ENV: staging
        # 나란히 설치용 접미사는 여기에 두지 않는다.
        # Codemagic 은 vars 값이 빈 문자열이면 yaml 자체를 invalid 로 만든다.
        # 기본(접미사 없음)은 build.gradle.kts 가 알아서 처리하고,
        # 나란히 깔 때만 Codemagic UI > Environment variables 에
        # ROUNDER_APP_ID_SUFFIX = .staging 을 추가해 빌드한다.
      groups:
        - solapi
      android_signing:
        - rounder_upload
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Select Firebase environment
        script: node tool/select_firebase_env.js --env "$APP_ENV"
      - name: Check Solapi env
        script: python3 tool/write_solapi_defines.py
      - name: Build release APK
        script: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          BUILD_NAME=${VERSION_LINE#version:}
          BUILD_NAME=${BUILD_NAME%%+*}
          BUILD_NUMBER=${VERSION_LINE##*+}
          echo "APK version: $BUILD_NAME+$BUILD_NUMBER"
          python3 tool/write_solapi_defines.py
          flutter build apk --release --android-skip-build-dependency-validation \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=APP_ENV="$APP_ENV" --dart-define-from-file=solapi_defines.json
    artifacts:
      - build/**/outputs/**/*.apk

  android-release:
    name: Android release AAB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        APP_ENV: staging
      groups:
        - solapi
      android_signing:
        - rounder_upload
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Select Firebase environment
        script: node tool/select_firebase_env.js --env "$APP_ENV"
      - name: Check Solapi env
        script: python3 tool/write_solapi_defines.py
      - name: Build release AAB
        script: |
          set +e
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          BUILD_NAME=${VERSION_LINE#version:}
          BUILD_NAME=${BUILD_NAME%%+*}
          BUILD_NUMBER=${VERSION_LINE##*+}
          echo "AAB version: $BUILD_NAME+$BUILD_NUMBER"
          python3 tool/write_solapi_defines.py
          flutter build appbundle --release --android-skip-build-dependency-validation \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=APP_ENV="$APP_ENV" --dart-define-from-file=solapi_defines.json \
            2>&1 | tee /tmp/rounder_aab.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "===== What went wrong (excerpt) ====="
            grep -n -A 25 "What went wrong" /tmp/rounder_aab.log || true
            echo "===== FAILURE lines ====="
            grep -n -E "FAILURE:|AAR metadata|Execution failed|error:" /tmp/rounder_aab.log | tail -n 40 || true
          fi
          exit $status
    artifacts:
      - build/**/outputs/**/*.aab
