org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Codemagic ↔ dl.google.com 이 끊겨도 같은 JAR을 다시 받는다.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=12
systemProp.org.gradle.internal.repository.initial.backoff=2000
android.useAndroidX=true
android.enableJetifier=true
# Allow Windows builds under non-ASCII paths (OneDrive Desktop).
android.overridePathCheck=true
# Flutter Gradle plugin still needs legacy AGP DSL / Kotlin plugin path on AGP 9.
android.newDsl=false
android.builtInKotlin=false
