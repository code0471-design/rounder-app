<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROUNDER 모임 초대</title>
  <meta name="description" content="ROUNDER 골프 모임 초대입니다. 라운더 앱에서 가입하세요." />
  <meta name="theme-color" content="#1B4D3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Noto+Serif+KR:wght@500;700&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .invite-body {
      min-height: 100vh;
      background: linear-gradient(165deg, #1b4d3e 0%, #0f2f26 55%, #152820 100%);
      color: #f7f3e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px 48px;
    }
    .invite-card {
      width: min(420px, 100%);
      background: rgba(247, 243, 232, 0.96);
      color: #152820;
      border-radius: 24px;
      padding: 28px 24px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      text-align: center;
    }
    .invite-mark {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      margin: 0 auto 16px;
      background: #1b4d3e;
      color: #f7f3e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .invite-kicker {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      font-weight: 800;
      color: #1b4d3e;
      margin-bottom: 8px;
    }
    .invite-card h1 {
      font-family: "Fraunces", "Noto Serif KR", serif;
      font-size: 1.55rem;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .invite-card p {
      color: #3a4e47;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    .invite-actions {
      display: grid;
      gap: 10px;
      margin-top: 22px;
    }
    .invite-actions .btn {
      width: 100%;
    }
    .invite-actions .btn-ghost {
      border-color: rgba(21, 40, 32, 0.18);
      color: #1b4d3e;
    }
    .invite-note {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #5b6f68;
    }
  </style>
</head>
<body class="invite-body">
  <div class="invite-card">
    <div class="invite-mark" aria-hidden="true">⛳</div>
    <div class="invite-kicker">GOLF CLUB INVITE</div>
    <h1 id="headline">골프 모임에 초대되었습니다</h1>
    <p id="subline">라운더 앱에서 초대를 확인하고 바로 가입하세요.</p>
    <div class="invite-actions">
      <a class="btn btn-primary" id="open-app" href="#">라운더 앱에서 열기</a>
      <a class="btn btn-ghost" id="play-store" href="https://play.google.com/store/apps/details?id=com.golfrounder.golf">앱이 없으면 Play에서 설치</a>
    </div>
    <p class="invite-note">카카오톡 안에서 안 열리면 오른쪽 위 메뉴에서 Chrome으로 열어 주세요.</p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var club = params.get("name") || params.get("clubName") || "";
      var inviter = params.get("inviter") || params.get("inviterName") || "";
      var token = params.get("token") || "";
      var clubId = params.get("club") || params.get("clubId") || "";
      var type = params.get("type") || "regular";
      var referrer = params.get("referrer") || "";
      var referrerName = params.get("referrerName") || "";
      var guest = params.get("guest") || "";

      var q = new URLSearchParams();
      if (token) q.set("token", token);
      if (clubId) q.set("club", clubId);
      if (club) q.set("name", club);
      if (inviter) q.set("inviter", inviter);
      if (type) q.set("type", type);
      if (referrer) q.set("referrer", referrer);
      if (referrerName) q.set("referrerName", referrerName);
      if (guest) q.set("guest", guest);
      var qs = q.toString();
      var deep = "rounder://invite" + (qs ? "?" + qs : "");
      var play = "https://play.google.com/store/apps/details?id=com.golfrounder.golf";
      var intent =
        "intent://invite" +
        (qs ? "?" + qs : "") +
        "#Intent;scheme=rounder;package=com.golfrounder.golf;S.browser_fallback_url=" +
        encodeURIComponent(play) +
        ";end";

      var headline = document.getElementById("headline");
      var subline = document.getElementById("subline");
      if (club) {
        headline.textContent = "'" + club + "' 골프 모임 초대";
      }
      if (inviter) {
        subline.textContent = inviter + "님이 라운더로 초대했습니다. 앱에서 바로 가입할 수 있습니다.";
      }

      var ua = navigator.userAgent || "";
      var android = /android/i.test(ua);
      var open = document.getElementById("open-app");
      open.href = android ? intent : deep;
      open.addEventListener("click", function (e) {
        if (android) return;
        e.preventDefault();
        window.location.href = deep;
        setTimeout(function () {
          window.location.href = play;
        }, 1600);
      });

      if (android) {
        setTimeout(function () {
          window.location.href = intent;
        }, 400);
      }
    })();
  </script>
</body>
</html>
