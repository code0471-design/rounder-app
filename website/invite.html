<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROUNDER 모임 초대</title>
  <meta name="description" content="ROUNDER 골프 모임 초대입니다. 앱에서 바로 가입하세요." />
  <meta name="theme-color" content="#1B4D3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Noto+Serif+KR:wght@500;700&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .invite-body {
      min-height: 100vh;
      background: linear-gradient(165deg, #1b4d3e 0%, #0f2f26 55%, #152820 100%);
      color: #f7f3e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px 48px;
    }
    .invite-card {
      width: min(420px, 100%);
      background: rgba(247, 243, 232, 0.96);
      color: #152820;
      border-radius: 24px;
      padding: 28px 24px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      text-align: center;
    }
    .invite-mark {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      margin: 0 auto 16px;
      background: #1b4d3e;
      color: #f7f3e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .invite-kicker {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      font-weight: 800;
      color: #1b4d3e;
      margin-bottom: 8px;
    }
    .invite-card h1 {
      font-family: "Fraunces", "Noto Serif KR", serif;
      font-size: 1.55rem;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .invite-card p {
      color: #3a4e47;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    .invite-actions {
      display: grid;
      gap: 10px;
      margin-top: 22px;
    }
    .invite-actions .btn {
      width: 100%;
    }
  </style>
</head>
<body class="invite-body">
  <div class="invite-card">
    <div class="invite-mark" aria-hidden="true">⛳</div>
    <div class="invite-kicker">GOLF CLUB INVITE</div>
    <h1 id="headline">골프 모임에 초대되었습니다</h1>
    <p id="subline">앱에서 가입하기를 누르면, 설치된 경우 바로 가입되고 없으면 스토어로 이동합니다.</p>
    <div class="invite-actions">
      <a class="btn btn-primary" id="join-app" href="#">앱에서 가입하기</a>
    </div>
  </div>
  <script>
    (function () {
      var KEY = "rounder_pending_invite_v1";
      var params = new URLSearchParams(window.location.search);
      var hasQuery = false;
      params.forEach(function () { hasQuery = true; });
      if (!hasQuery) {
        try {
          var saved = localStorage.getItem(KEY);
          if (saved) params = new URLSearchParams(saved);
        } catch (e) {}
      }

      var club = params.get("name") || params.get("clubName") || "";
      var inviter = params.get("inviter") || params.get("inviterName") || "";
      var token = params.get("token") || "";
      var clubId = params.get("club") || params.get("clubId") || "";
      var type = params.get("type") || "regular";
      var referrer = params.get("referrer") || "";
      var referrerName = params.get("referrerName") || "";
      var guest = params.get("guest") || "";

      var q = new URLSearchParams();
      if (token) q.set("token", token);
      if (clubId) q.set("club", clubId);
      if (club) q.set("name", club);
      if (inviter) q.set("inviter", inviter);
      if (type) q.set("type", type);
      if (referrer) q.set("referrer", referrer);
      if (referrerName) q.set("referrerName", referrerName);
      if (guest) q.set("guest", guest);
      var qs = q.toString();
      try {
        if (qs) localStorage.setItem(KEY, qs);
      } catch (e) {}

      var deep = "rounder://invite" + (qs ? "?" + qs : "");
      var play =
        "https://play.google.com/store/apps/details?id=com.golfrounder.golf" +
        (qs ? "&referrer=" + encodeURIComponent(qs) : "");
      var intent =
        "intent://invite" +
        (qs ? "?" + qs : "") +
        "#Intent;scheme=rounder;package=com.golfrounder.golf;S.browser_fallback_url=" +
        encodeURIComponent(play) +
        ";end";

      var headline = document.getElementById("headline");
      var subline = document.getElementById("subline");
      if (club) {
        headline.textContent = "'" + club + "' 골프 모임 초대";
      }
      if (inviter) {
        subline.textContent =
          inviter + "님이 초대했습니다. 앱이 있으면 바로 가입되고, 없으면 스토어로 이동합니다.";
      }

      var ua = navigator.userAgent || "";
      var android = /android/i.test(ua);
      var btn = document.getElementById("join-app");
      btn.href = android ? intent : deep;

      function openApp() {
        window.location.href = android ? intent : deep;
      }

      btn.addEventListener("click", function (e) {
        if (android) return;
        e.preventDefault();
        openApp();
        setTimeout(function () {
          if (!document.hidden) window.location.href = play;
        }, 1600);
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) return;
        setTimeout(openApp, 300);
      });
      window.addEventListener("pageshow", function () {
        if (sessionStorage.getItem("rounder_invite_tried") === "1") {
          setTimeout(openApp, 300);
        }
      });
      btn.addEventListener("click", function () {
        sessionStorage.setItem("rounder_invite_tried", "1");
      });
    })();
  </script>
</body>
</html>
