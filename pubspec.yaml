name: golf_rounder
description: ROUNDER - 골프 모임 관리 앱
publish_to: 'none'
version: 1.0.0+31

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  http: 1.5.0
  crypto: ^3.0.7
  intl: ^0.20.2
  cached_network_image: 3.4.1
  cupertino_icons: ^1.0.2
  image_picker: 1.1.2
  url_launcher: ^6.3.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^19.5.0
  # SDK 3.7 호환 (V1 본인인증). Flutter/SDK 업그레이드 후 ^1.0.4(V2)로 교체 가능
  portone_flutter: 0.12.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  kakao_flutter_sdk_user: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: 2.0.1
  build_runner: 2.4.6
  flutter_launcher_icons: ^0.14.3
  image: ^4.8.0

# portone_flutter pulls app_links; 6.4.x AAR requires compileSdk 36 and breaks older plugins.
dependency_overrides:
  app_links: 6.3.3

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/icons/app_icon.png
  # Android sources are generated by scripts/make_android_icons.dart so the
  # adaptive foreground has no baked-in white square.
  image_path_android: assets/icons/app_icon_android.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/KakaoTalk_20260724_132326103.png
    - assets/images/KakaoTalk_20260724_131658153.png
    - assets/images/rounder_logo.png
    - assets/images/rounder_logo_header.png
    - assets/images/rounder_logo_transparent.png
    - assets/images/rounder_logo_vertical_transparent.png
    - assets/images/rounder_intro_logo.png
    - assets/icons/
    - assets/icons/rounder_emblem_nobg.png
    - assets/icons/rounder_ball_crop.png
    - assets/icons/rounder_emblem_final.png
